name: CI

on:
  push:
    branches: [master, 'feat/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run test:contracts

      - run: npm run test:api
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --omit=dev
